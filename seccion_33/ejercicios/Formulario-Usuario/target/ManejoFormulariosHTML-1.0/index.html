<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ejercicio Formulario - Servlets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
      <div class="container mt-5">
          <div class="row">
              <div class="col-md-6 offset-md-3">
                  <div class="card">
                      <div class="card-header text-center">
                          <h3>Formulario Registro de Datos</h3>
                      </div>
                      <div class="card-body">
                          <form name="formulario1" action="/ManejoFormulariosHTML/Servlet" method="POST">
                              <!--Elemento oculto-->
                              <input type="hidden" name="oculto" value="nuevo valor oculto"/>
                              
                              <!--Usuario-->
                              <div class="mb-3">
                                  <label for="usuario" class="form-label">Usuario (*)</label>
                                  <input type="text" class="form-control" name="usuario" id="usuario" 
                                         value="Escribir usuario" required />
                              </div>
                                  
                          </form>
                      </div>
                  </div>
              </div>
          </div>
      </div>
      
      
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
